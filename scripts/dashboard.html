<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zcrew dashboard</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --text: #1b2430; --muted: #66707d; --border: #d9dee6;
    --accent: #2563eb; --accent-soft: #e8effd;
    --ok: #16a34a; --ok-soft: #e9f9ef;
    --run: #2563eb; --run-soft: #e8effd;
    --fail: #dc2626; --fail-soft: #fdecec;
    --idle: #8a94a2; --idle-soft: #eef0f3;
    --done: #0e7490; --done-soft: #e6f6f9;
    --mono: ui-monospace, Consolas, "Cascadia Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1319; --panel: #161d26; --text: #dfe6ee; --muted: #8d99a8; --border: #2a3441;
      --accent: #5b8cff; --accent-soft: #1c2a45;
      --ok: #34d399; --ok-soft: #12291e;
      --run: #5b8cff; --run-soft: #1c2a45;
      --fail: #f87171; --fail-soft: #3a1a1a;
      --idle: #7d8896; --idle-soft: #1d232c;
      --done: #38bdf8; --done-soft: #0f2733;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .head-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; }
  #scope { color: var(--muted); font-size: 12px; word-break: break-all; }
  .banner { margin-top: 8px; padding: 6px 10px; border-radius: 6px; font-size: 12.5px; }
  #banner-degraded { background: var(--done-soft); color: var(--done); }
  #banner-error { background: var(--fail-soft); color: var(--fail); word-break: break-word; }
  main { flex: 1; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 12px;
         padding: 12px; min-height: 0; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
       margin: 0; padding: 10px 12px 6px; }
  #cards { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .card { padding: 9px 10px; border: 1px solid transparent; border-radius: 8px; cursor: pointer;
          margin-bottom: 6px; }
  .card:hover { background: var(--bg); }
  .card.selected { background: var(--accent-soft); border-color: var(--accent); }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .sid { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px;
          border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.running { color: var(--run); background: var(--run-soft); }
  .pill.completed { color: var(--done); background: var(--done-soft); }
  .pill.failed { color: var(--fail); background: var(--fail-soft); }
  .pill.idle { color: var(--idle); background: var(--idle-soft); }
  .pill.completed .dot, .pill.idle .dot { opacity: .55; }
  .pill.running .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .title { font-weight: 600; margin-top: 6px; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex;
          flex-wrap: wrap; gap: 4px 10px; overflow-wrap: anywhere; }
  .err-num { color: var(--fail); font-weight: 600; }
  .placeholder { color: var(--muted); padding: 24px 12px; text-align: center; }
  #detail-head { padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .head-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .head-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  #detail-head .meta { margin-top: 4px; }
  .mono { font-family: var(--mono); font-size: 11px; }
  #timeline { flex: 1; overflow-y: auto; padding: 8px 8px 12px; font-family: var(--mono);
              font-size: 12.5px; }
  .act { display: flex; gap: 8px; padding: 3px 8px; border-radius: 6px; align-items: baseline;
         border-left: 3px solid transparent; }
  .act.live { border-left-color: var(--run); background: var(--run-soft); }
  .act.err { border-left-color: var(--fail); }
  .act.err .summary { color: var(--fail); }
  .act.live .summary::after { content: " ..."; }
  .act .t { color: var(--muted); flex: 0 0 auto; }
  .act .ico { flex: 0 0 auto; font-weight: 700; color: var(--accent); width: 14px;
              text-align: center; }
  .act .kind { flex: 0 0 auto; color: var(--muted); width: 46px; overflow: hidden;
               text-overflow: ellipsis; }
  .act .summary { overflow-wrap: anywhere; white-space: pre-wrap; min-width: 0; }
  .act .detail { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 42vh) minmax(0, 1fr); }
  }
  @media (max-width: 430px) {
    body { font-size: 13px; }
    .act .kind { display: none; }
    .head-title { white-space: normal; }
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>zcrew dashboard</h1>
    <span id="scope"></span>
  </div>
  <div id="banner-degraded" class="banner" hidden>
    ZCode data layout changed; using slower exact parsing (numbers stay exact).
  </div>
  <div id="banner-error" class="banner" hidden></div>
</header>
<main>
  <section id="list">
    <h2>Sessions</h2>
    <div id="cards"></div>
  </section>
  <section id="detail">
    <div id="detail-head"></div>
    <div id="timeline"></div>
  </section>
</main>
<script>
"use strict";
(function () {
  var SESSIONS_MS = 3000;    // session list poll interval
  var ACTIVITY_MS = 1500;    // selected-session activity poll interval
  var SESSIONS_LIMIT = 100;  // below the server cap (200)

  var scopeEl = document.getElementById("scope");
  var degradedEl = document.getElementById("banner-degraded");
  var errorEl = document.getElementById("banner-error");
  var cardsEl = document.getElementById("cards");
  var headEl = document.getElementById("detail-head");
  var timelineEl = document.getElementById("timeline");

  var selectedId = null;
  var cursor = null;
  var firstLoad = true;
  var lastNowMs = 0;        // the API's clock (now_ms), refreshed by each sessions poll
  var rows = new Map();     // activity key -> row element (re-emitted keys replace in place)
  var noKeySeq = 0;

  // All server text goes through textContent; no HTML parsing of data anywhere.
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text) { node.textContent = text; }
    return node;
  }

  function safeClass(value) {
    return String(value).replace(/[^a-z0-9-]/ig, "");
  }

  function two(n) { return n < 10 ? "0" + n : String(n); }

  function fmtClock(ms) {
    var d = new Date(ms);
    return two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds());
  }

  function fmtStarted(ms) {
    var d = new Date(ms);
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear()
      && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    return sameDay ? fmtClock(ms).slice(0, 5)
      : d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate())
        + " " + fmtClock(ms).slice(0, 5);
  }

  function fmtDur(ms) {
    var secs = Math.max(0, ms) / 1000;
    if (secs < 60) { return secs.toFixed(1) + "s"; }
    var m = Math.floor(secs / 60);
    if (m < 60) { return m + "m" + two(Math.floor(secs) % 60) + "s"; }
    return Math.floor(m / 60) + "h" + two(m % 60) + "m";
  }

  function fmtNum(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function plural(n, word) {
    return n + " " + word + (n === 1 ? "" : "s");
  }

  // duration_ms only counts finished turns; a running session shows elapsed time
  // since it started, measured against the API's now_ms (not the client clock).
  function durationText(s) {
    if (s.status === "running") {
      return fmtDur(Math.max(0, (lastNowMs || Date.now()) - s.created_ms));
    }
    return fmtDur(s.duration_ms);
  }

  function titled(node, text) {
    node.setAttribute("title", text);  // plain text only, never markup
    return node;
  }

  function pill(status) {
    var p = el("span", "pill " + safeClass(status));
    p.appendChild(el("span", "dot"));
    p.appendChild(el("span", null, status));
    return p;
  }

  function setHead(summary) {
    headEl.textContent = "";
    if (!summary) {
      headEl.appendChild(el("div", "placeholder", "Select a session on the left."));
      return;
    }
    var top = el("div", "head-top");
    top.appendChild(pill(summary.status));
    top.appendChild(titled(el("span", "head-title", summary.title || "(no title)"),
                          summary.title || "(no title)"));
    headEl.appendChild(top);
    var meta = el("div", "meta");
    meta.appendChild(el("span", "mono", summary.id.slice(0, 13)));
    if (summary.directory) { meta.appendChild(el("span", null, summary.directory)); }
    meta.appendChild(el("span", null, "started " + fmtStarted(summary.created_ms)));
    meta.appendChild(el("span", null, durationText(summary)));
    meta.appendChild(el("span", null, plural(summary.tool_calls, "tool")));
    if (summary.errors) { meta.appendChild(el("span", "err-num", plural(summary.errors, "error"))); }
    if (summary.last_context_tokens != null) {
      meta.appendChild(el("span", null, "ctx " + fmtNum(summary.last_context_tokens)));
    }
    headEl.appendChild(meta);
  }

  function sessionCard(s) {
    var card = el("div", "card" + (s.id === selectedId ? " selected" : ""));
    var top = el("div", "card-top");
    top.appendChild(pill(s.status));
    top.appendChild(el("span", "sid", s.id.slice(0, 13)));
    card.appendChild(top);
    card.appendChild(titled(el("div", "title", s.title || "(no title)"), s.title || "(no title)"));
    var meta = el("div", "meta");
    meta.appendChild(el("span", null, fmtStarted(s.created_ms)));
    meta.appendChild(el("span", null, durationText(s)));
    meta.appendChild(el("span", null, plural(s.tool_calls, "tool")));
    if (s.errors) { meta.appendChild(el("span", "err-num", plural(s.errors, "error"))); }
    if (s.last_context_tokens != null) {
      meta.appendChild(el("span", null, "ctx " + fmtNum(s.last_context_tokens)));
    }
    card.appendChild(meta);
    card.addEventListener("click", function () { select(s.id); });
    return card;
  }

  function renderSessions(data) {
    scopeEl.textContent = data.scope || "";
    degradedEl.hidden = !data.layoutDegraded;
    cardsEl.textContent = "";
    var sessions = data.sessions || [];
    if (!sessions.length) {
      cardsEl.appendChild(el("div", "placeholder", "No sessions found in this scope."));
      return;
    }
    for (var i = 0; i < sessions.length; i++) {
      cardsEl.appendChild(sessionCard(sessions[i]));
    }
  }

  function autoSelect(sessions) {
    if (!firstLoad) { return; }
    firstLoad = false;
    if (!sessions.length) { return; }
    var newestRunning = null;  // list is newest first
    for (var i = 0; i < sessions.length; i++) {
      if (sessions[i].status === "running") { newestRunning = sessions[i]; break; }
    }
    select((newestRunning || sessions[0]).id);
  }

  function select(id) {
    if (selectedId === id) { return; }
    selectedId = id;
    cursor = null;
    rows.clear();
    timelineEl.textContent = "";
    setHead(null);
    fetchActivity();
  }

  function nearBottom() {
    return timelineEl.scrollHeight - timelineEl.scrollTop - timelineEl.clientHeight < 48;
  }

  function decorate(row, a) {
    row._t.textContent = a.time;
    row._ico.textContent = a.icon;
    row._kind.textContent = a.label;
    row._summary.textContent = a.summary;
    row._detail.textContent = (a.detail && a.summary.indexOf(a.detail) === -1)
      ? "-> " + a.detail : "";
    var live = a.status === "running" || a.status === "pending";
    var err = a.status === "error" || a.status === "failed";
    row.classList.toggle("live", live);
    row.classList.toggle("err", err);
  }

  function buildRow(a) {
    var row = el("div", "act");
    row._t = el("span", "t");
    row._ico = el("span", "ico");
    row._kind = el("span", "kind");
    row._summary = el("span", "summary");
    row._detail = el("span", "detail");
    row.appendChild(row._t);
    row.appendChild(row._ico);
    row.appendChild(row._kind);
    row.appendChild(row._summary);
    row.appendChild(row._detail);
    decorate(row, a);
    return row;
  }

  function appendActivity(items) {
    if (!items.length) { return; }
    var stick = nearBottom();
    for (var i = 0; i < items.length; i++) {
      var a = items[i];
      var key = a.key || ("_nokey_" + noKeySeq++);
      var row = rows.get(key);
      if (row) {
        decorate(row, a);  // same key re-emitted (running -> completed): replace in place
      } else {
        row = buildRow(a);
        rows.set(key, row);
        timelineEl.appendChild(row);
      }
    }
    if (stick) { timelineEl.scrollTop = timelineEl.scrollHeight; }
  }

  function fetchJson(url) {
    return fetch(url).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          var err = new Error(data.error || ("HTTP " + res.status));
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  function showError(err) {
    errorEl.textContent = "API error: " + (err && err.message ? err.message : String(err));
    errorEl.hidden = false;
  }

  function fetchActivity() {
    if (!selectedId) { return Promise.resolve(); }
    var url = "/api/sessions/" + encodeURIComponent(selectedId) + "/activity";
    if (cursor) { url += "?after=" + encodeURIComponent(cursor); }
    return fetchJson(url).then(function (data) {
      errorEl.hidden = true;
      setHead(data.summary);
      appendActivity(data.activity || []);
      cursor = data.cursor || null;
    }, function (err) {
      showError(err);
      if (String(err && err.message).indexOf("cursor") !== -1) { cursor = null; }
    });
  }

  function pollSessions() {
    fetchJson("/api/sessions?limit=" + SESSIONS_LIMIT).then(function (data) {
      errorEl.hidden = true;
      if (data.now_ms) { lastNowMs = data.now_ms; }
      renderSessions(data);
      autoSelect(data.sessions || []);
    }, showError).then(function () {
      setTimeout(pollSessions, SESSIONS_MS);
    });
  }

  function pollActivity() {
    fetchActivity().then(function () {
      setTimeout(pollActivity, ACTIVITY_MS);
    });
  }

  setHead(null);
  pollSessions();
  pollActivity();
})();
</script>
</body>
</html>
