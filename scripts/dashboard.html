<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zcrew dashboard</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bezel: #0b0b0a; --panel: #131210; --hair: #2a2622;
    --text: #e9e4da; --muted: #9a9186;
    --amber: #ffb000; --red: #ff3b1f; --green: #39ff88;
    --mono: ui-monospace, Consolas, "Cascadia Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bezel); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; display: flex; flex-direction: column;
  }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; }
  .mono { font-family: var(--mono); }

  /* --- header: banners + instrument strip + scope -------------------------- */
  header { padding: 10px 12px 0; border-bottom: 1px solid var(--hair); flex: 0 0 auto; }
  .banner { margin-bottom: 8px; padding: 6px 10px; font-size: 13px; border: 1px solid; }
  #banner-degraded { color: var(--amber); border-color: rgba(255,176,0,.35);
                     background: rgba(255,176,0,.07); }
  #banner-error { color: var(--red); border-color: rgba(255,59,31,.4);
                  background: rgba(255,59,31,.07); word-break: break-word; }
  #strip { display: flex; flex-wrap: wrap; align-items: flex-end;
           background: var(--panel); border: 1px solid var(--hair); }
  #strip .ro { flex: 1 1 auto; padding: 10px 14px 8px; }
  #strip .ro + .ro { border-left: 1px solid var(--hair); }
  #scope { display: flex; gap: 10px; color: var(--muted); font-size: 11px;
           padding: 7px 0 10px; }
  #scope-path { font-family: var(--mono); word-break: break-all; min-width: 0; }
  #present-btn { margin-left: auto; flex: 0 0 auto; font: inherit; font-size: 11px;
                 letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
                 background: none; border: 1px solid var(--hair); padding: 2px 10px;
                 cursor: pointer; }
  #present-btn:hover { color: var(--text); border-color: var(--muted); }
  #present-btn:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
  #present-btn[aria-pressed="true"] { color: var(--amber); border-color: var(--amber); }

  /* --- seven-segment cells ---------------------------------------------------
     A cell is 7 absolutely-placed <i> segments in order a,b,c,d,e,f,g. Shapes
     are hexagonal bars via clip-path; cells lean like a bedside clock. Lit
     segments carry .on (lit colour + glow); unlit ones stay as 8% ghosts. */
  .ro { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .crow { display: flex; align-items: flex-end; }
  .cells { display: flex; align-items: flex-end; gap: 4px;
           --ch: clamp(40px, 4.6vw, 72px); --cw: calc(var(--ch) * .536); }
  #dh-ros .cells { --ch: calc(clamp(40px, 4.6vw, 72px) * .6); }  /* medium: ~60% of the strip */
  .unit { font-size: 11px; color: var(--muted); margin-left: 4px; font-family: var(--mono); }
  .legend { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
            color: var(--muted); white-space: nowrap; text-shadow: 0 1px 0 #000; }
  .am { --lt: #ffb000; --gh: rgba(255,176,0,.08); }
  .rd { --lt: #ff3b1f; --gh: rgba(255,59,31,.08); }
  .gn { --lt: #39ff88; --gh: rgba(57,255,136,.08); }
  .sc, .co { position: relative; display: inline-block; transform: skewX(-6deg); flex: 0 0 auto; }
  .sc { width: var(--cw); height: var(--ch); }
  .co { width: calc(var(--cw) * .42); height: var(--ch); }
  .sc i, .co i { position: absolute; display: block; background: var(--gh); }
  .sc i.on { background: var(--lt); filter: drop-shadow(0 0 4px var(--lt)); }
  .sc i:nth-child(1), .sc i:nth-child(4), .sc i:nth-child(7) {
    left: 27%; width: 46%; height: 14%;
    clip-path: polygon(16% 0, 84% 0, 100% 50%, 84% 100%, 16% 100%, 0 50%); }
  .sc i:nth-child(2), .sc i:nth-child(3), .sc i:nth-child(5), .sc i:nth-child(6) {
    width: 27%; height: 37%;
    clip-path: polygon(0 21%, 50% 0, 100% 21%, 100% 79%, 50% 100%, 0 79%); }
  .sc i:nth-child(1) { top: 0; }
  .sc i:nth-child(2) { left: 73%; top: 9%; }
  .sc i:nth-child(3) { left: 73%; top: 54%; }
  .sc i:nth-child(4) { top: 86%; }
  .sc i:nth-child(5) { left: 0; top: 54%; }
  .sc i:nth-child(6) { left: 0; top: 9%; }
  .sc i:nth-child(7) { top: 43%; }
  .co i { left: 22%; width: 56%; height: 12%; background: var(--lt); }
  .co i:nth-child(1) { top: 27%; }
  .co i:nth-child(2) { top: 61%; }
  .co.off i { background: var(--gh); }
  @keyframes segblink { 0% { opacity: 1; } 50% { opacity: .1; } }
  .unset .sc i.on { animation: segblink 1s step-end infinite; }  /* flashing unset clock */
  #ro-clock .co i { animation: segblink 1s step-end infinite; }  /* 1 Hz colon */

  /* --- main columns --------------------------------------------------------- */
  main { flex: 1; display: grid; grid-template-columns: minmax(300px, 380px) 1fr;
         gap: 12px; padding: 12px; min-height: 0; }
  section { background: var(--panel); border: 1px solid var(--hair);
            display: flex; flex-direction: column; min-height: 0; min-width: 0; }

  /* --- session rack --------------------------------------------------------- */
  #rack { flex: 1; overflow-y: auto; }
  .row { position: relative; padding: 9px 18px 9px 16px; cursor: pointer; }
  .row + .row { border-top: 1px solid var(--hair); }
  .row:hover { background: #1b1814; }
  .row.sel { background: #191713; }
  .row.sel::before, .row.sel::after { content: ""; position: absolute; top: 5px; bottom: 5px;
                                      width: 4px; border: 1px solid var(--amber); }
  .row.sel::before { left: 5px; border-right: none; }
  .row.sel::after { right: 5px; border-left: none; }
  .row:focus-visible { outline: 1px solid var(--amber); outline-offset: -1px; }
  .r1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .lamp { display: inline-block; width: 7px; height: 7px; flex: 0 0 auto; background: var(--hair); }
  .lamp.run { background: var(--green); filter: drop-shadow(0 0 2px var(--green)); }
  .lamp.fail { background: var(--red); filter: drop-shadow(0 0 2px var(--red)); }
  .lamp.done { background: var(--amber); }
  .st { font-size: 16px; font-weight: 700; letter-spacing: .1em; flex: 0 0 auto; }
  .st.run { color: var(--green); }
  .st.fail { color: var(--red); }
  .st.done { color: var(--amber); }
  .st.idle { color: var(--muted); }
  .sid { font-family: var(--mono); font-size: 13px; color: var(--muted);
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .rtitle { margin-top: 5px; font-size: 16px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
  .rmeta { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 4px;
           font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .m-e.bad { color: var(--red); }
  .placeholder { color: var(--muted); padding: 24px 14px; font-size: 13px; }

  /* --- selected session: head readouts + timeline --------------------------- */
  #detail-head { padding: 12px 14px 6px; border-bottom: 1px solid var(--hair); flex: 0 0 auto; }
  .dh-top { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .dh-title { font-size: 20px; font-weight: 600; min-width: 0; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
  .dh-sub { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px;
            font-family: var(--mono); font-size: 11px; color: var(--muted);
            overflow-wrap: anywhere; }
  #dh-ros { display: flex; flex-wrap: wrap; margin: 10px -14px 8px; padding: 0 14px; }
  #dh-ros .ro { padding: 2px 20px 0 0; }
  #dh-ros .ro + .ro { border-left: 1px solid var(--hair); padding-left: 20px; }
  #timeline { flex: 1; overflow-y: auto; padding: 8px 6px 12px;
              font-family: var(--mono); font-size: 13px; }
  .act { display: flex; gap: 8px; padding: 3px 8px; align-items: baseline; }
  .act .lamp { align-self: center; }
  .act.live { background: rgba(57,255,136,.06); }
  .act.live .lamp { background: var(--green); }
  .act.live .summary::after { content: " ..."; }
  .act.err .lamp { background: var(--red); }
  .act.err .summary { color: var(--red); }
  .act .t { color: var(--muted); flex: 0 0 auto; }
  .act .kind { flex: 0 0 52px; color: var(--muted); overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .act .summary { flex: 1 1 55%; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .act .detail { flex: 1 1 45%; min-width: 0; color: var(--muted); overflow-wrap: anywhere; }

  /* --- present mode: the demo view follows the runner ------------------------
     One CSS class on <body>; every render path stays untouched. The rack and the
     low-value id/path text drop out, the readouts grow, and the timeline keeps
     only its newest rows visible (they all stay in the DOM). */
  body.present #rackwrap { display: none; }
  body.present main { grid-template-columns: 1fr; }
  body.present #scope span { display: none; }  /* the scope line keeps only the button */
  body.present .dh-sub { display: none; }       /* session id + directory: demo noise */
  body.present .dh-title { white-space: normal; overflow-wrap: anywhere;
                           display: -webkit-box; -webkit-line-clamp: 2;
                           -webkit-box-orient: vertical; overflow: hidden; }
  body.present #dh-ros .cells { --ch: clamp(40px, 4.6vw, 72px); }
  body.present #timeline { font-size: 16px; }
  body.present .act:not(:nth-last-child(-n+30)) { display: none; }  /* newest 30 only */
  .act .detail:empty { display: none; }  /* an empty detail must not reserve 45% of the row */

  @media (min-width: 761px) {  /* big strip cells only where they cannot overflow a row */
    body.present #strip .ro { flex: 1 1 0; }  /* one row: 5.2vw keeps a 4-cell clock inside a sixth with room */
    body.present #strip .cells { --ch: clamp(40px, 5.2vw, 128px); }
  }

  @media (min-width: 900px) {
    #strip .ro { flex: 1 1 0; }  /* equal shares across the full-width bezel */
  }
  @media (max-width: 899px) {
    body { height: auto; min-height: 100%; }  /* the page scrolls naturally */
    main { flex: none; grid-template-columns: 1fr; }
    #rackwrap { max-height: 40vh; }           /* the rack keeps its own scroll */
    #timeline { min-height: 60vh; }
  }
  @media (max-width: 760px) {
    main { gap: 16px; padding: 16px; }
    header { padding: 10px 16px 0; }
    #strip .ro { flex: 1 1 25%; padding: 8px 10px 6px; }  /* wraps 4 + 2 */
    #dh-ros { display: grid; grid-template-columns: 1fr 1fr; }
    #dh-ros .ro { padding: 2px 0 0; }
    #dh-ros .ro + .ro { border-left: none; padding-left: 0; }
    #dh-ros .ro:nth-child(2n) { border-left: 1px solid var(--hair); }
  }
  @media (max-width: 430px) {
    .act .kind { display: none; }
    .dh-title { white-space: normal; }
    #strip .ro { flex-basis: 30%; }  /* wraps 3 + 3: four 40px readouts overflow a phone row */
    #strip .cells { --ch: 32px; }    /* a 4-cell clock must fit a third of 343px */
    body.present #timeline { font-size: 13px; }  /* 16px leaves ~15 chars per line on a phone */
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<!-- DIRECTION CONTRACT
THESIS: a glance panel of instrument readouts; the fleet's state is read like a clock across the room. Refuses the sidebar+badge dev dashboard.
OWN-WORLD: seven-segment cells with ghost segments on a matte #0b0b0a bezel; amber #ffb000 readouts, red #ff3b1f failure, green #39ff88 running; engraved small-caps legends; mono data rows.
STORY: the viewer sees how many workers run or fail, how big the context is and how long it has run, then reads what the selected worker is doing.
FIRST VIEWPORT: full-width readout strip (RUNNING, FAILED, ERRORS, CTX, ELAPSED, wall clock), then session rack left and live timeline right.
FORM: challenger signals-instruments-seven-segment-alarm-clock; seed key 98bf20e6.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<header>
  <h1 class="vh">zcrew dashboard</h1>
  <div id="banner-degraded" class="banner" hidden>
    ZCode data layout changed; using slower exact parsing (numbers stay exact).
  </div>
  <div id="banner-error" class="banner" hidden></div>
  <div id="strip">
    <div class="ro" id="ro-running"></div>
    <div class="ro" id="ro-failed"></div>
    <div class="ro" id="ro-errors"></div>
    <div class="ro" id="ro-ctx"></div>
    <div class="ro" id="ro-elapsed"></div>
    <div class="ro" id="ro-clock"></div>
  </div>
  <div id="scope"><span>scope</span><span id="scope-path"></span><button id="present-btn" type="button" aria-pressed="false">Present</button></div>
</header>
<main>
  <section id="rackwrap">
    <div id="rackempty" class="placeholder" hidden>No sessions in this scope.</div>
    <div id="rack" role="listbox" aria-label="Sessions"></div>
  </section>
  <section id="detail">
    <div id="detail-head">
      <div id="nosel" class="placeholder">Select a session.</div>
      <div id="dh" hidden>
        <div class="dh-top">
          <span id="dh-st" class="st"></span>
          <span id="dh-title" class="dh-title"></span>
        </div>
        <div class="dh-sub"><span id="dh-id"></span><span id="dh-dir"></span></div>
        <div id="dh-ros">
          <div class="ro" id="ro-dur"></div>
          <div class="ro" id="ro-tools"></div>
          <div class="ro" id="ro-herr"></div>
          <div class="ro" id="ro-hctx"></div>
        </div>
      </div>
    </div>
    <div id="timeline"></div>
  </section>
</main>
<script>
"use strict";
(function () {
  var SESSIONS_MS = 3000;    // session list poll interval
  var ACTIVITY_MS = 1500;    // selected-session activity poll interval
  var SESSIONS_LIMIT = 100;  // below the server cap (200)

  // --- seven-segment readouts -------------------------------------------------
  // A glyph is a bitmask over segments a,b,c,d,e,f,g (DOM order, bit i = child i).
  var GLYPH = { "0": 63, "1": 6, "2": 91, "3": 79, "4": 102, "5": 109,
                "6": 125, "7": 7, "8": 127, "9": 111, "-": 64, " ": 0 };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text) { node.textContent = text; }
    return node;
  }

  // All server text goes through textContent (diffed); no HTML parsing anywhere.
  function setText(node, s) {
    if (node.textContent !== s) { node.textContent = s; }
  }

  function segCell() {
    var c = el("span", "sc");
    for (var i = 0; i < 7; i++) { c.appendChild(document.createElement("i")); }
    c._g = " ";
    return c;
  }

  function setCell(cell, g) {
    if (cell._g === g) { return; }
    cell._g = g;
    var m = GLYPH[g] || 0, kids = cell.childNodes;
    for (var i = 0; i < 7; i++) {
      var want = ((m >> i) & 1) ? "on" : "";
      if (kids[i].className !== want) { kids[i].className = want; }
    }
  }

  // A readout is a fixed number of digit cells (never reflows), with an optional
  // colon cell after digit `colonAfter`. Units are printed legends, not segments.
  function makeRO(host, nDigits, colonAfter, hue, legend, unit) {
    var crow = el("div", "crow");
    var cellsEl = el("div", "cells " + hue);
    var cells = [], colon = null;
    for (var i = 0; i < nDigits; i++) {
      if (i === colonAfter) {
        colon = el("span", "co");
        colon.appendChild(document.createElement("i"));
        colon.appendChild(document.createElement("i"));
        cellsEl.appendChild(colon);
      }
      var c = segCell();
      cellsEl.appendChild(c);
      cells.push(c);
    }
    crow.appendChild(cellsEl);
    if (unit) { crow.appendChild(el("span", "unit", unit)); }
    host.appendChild(crow);
    if (legend) { host.appendChild(el("div", "legend", legend)); }
    return { host: host, cellsEl: cellsEl, cells: cells, colon: colon };
  }

  // "07:32" maps onto cells left to right; ':' rides the fixed colon slot.
  function setRO(ro, s) {
    var ci = 0;
    for (var i = 0; i < s.length && ci < ro.cells.length; i++) {
      var ch = s.charAt(i);
      if (ch !== ":") { setCell(ro.cells[ci++], ch); }
    }
    for (; ci < ro.cells.length; ci++) { setCell(ro.cells[ci], " "); }
    if (ro.colon) {
      var cls = s.indexOf(":") !== -1 ? "co" : "co off";
      if (ro.colon.className !== cls) { ro.colon.className = cls; }
    }
  }

  function setHue(ro, hue) {
    var cls = "cells " + hue;
    if (ro.cellsEl.className !== cls) { ro.cellsEl.className = cls; }
  }

  // --- formatting ---------------------------------------------------------------

  function two(n) { return n < 10 ? "0" + n : String(n); }
  function three(n) { return n < 10 ? "00" + n : (n < 100 ? "0" + n : String(n)); }
  function padL(s, n) { while (s.length < n) { s = " " + s; } return s; }

  function fmtClock(ms) {
    var d = new Date(ms);
    return two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds());
  }

  function fmtStarted(ms) {
    var d = new Date(ms);
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear()
      && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    return sameDay ? fmtClock(ms).slice(0, 5)
      : d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate())
        + " " + fmtClock(ms).slice(0, 5);
  }

  function fmtDur(ms) {  // compact text for rack rows ("42.1s", "3m12s", "2h05m")
    var secs = Math.max(0, ms) / 1000;
    if (secs < 60) { return secs.toFixed(1) + "s"; }
    var m = Math.floor(secs / 60);
    if (m < 60) { return m + "m" + two(Math.floor(secs) % 60) + "s"; }
    return Math.floor(m / 60) + "h" + two(m % 60) + "m";
  }

  function fmtElapsedRO(ms) {  // segment display: mm:ss, or h:mm past an hour
    var s = Math.floor(Math.max(0, ms) / 1000);
    var h = Math.floor(s / 3600);
    if (h > 99) { return "--:--"; }  // off the 4-cell scale (>4 days)
    if (h > 0) { return padL(String(h), 2) + ":" + two(Math.floor((s % 3600) / 60)); }
    return two(Math.floor(s / 60)) + ":" + two(s % 60);
  }

  function fmtK(tok) { return Math.round(tok / 1000) + "k"; }

  // --- state --------------------------------------------------------------------

  var STATUS = {
    running: ["run", "RUN"], completed: ["done", "DONE"],
    failed: ["fail", "FAIL"], idle: ["idle", "IDLE"]
  };

  function byId(id) { return document.getElementById(id); }
  var scopePathEl = byId("scope-path"), degradedEl = byId("banner-degraded"), errorEl = byId("banner-error");
  var rackEl = byId("rack"), rackEmptyEl = byId("rackempty");
  var noselEl = byId("nosel"), dhEl = byId("dh"), timelineEl = byId("timeline");
  var dhTitle = byId("dh-title"), dhSt = byId("dh-st"), dhId = byId("dh-id"), dhDir = byId("dh-dir");
  var presentBtn = byId("present-btn");

  var roRun = makeRO(byId("ro-running"), 2, -1, "gn", "Running");
  var roFail = makeRO(byId("ro-failed"), 2, -1, "rd", "Failed");
  var roErr = makeRO(byId("ro-errors"), 3, -1, "am", "Errors");
  var roCtx = makeRO(byId("ro-ctx"), 4, -1, "am", "Context", "k");
  var roElapsed = makeRO(byId("ro-elapsed"), 4, 2, "am", "Elapsed");
  var roClock = makeRO(byId("ro-clock"), 4, 2, "am", "Local");
  var roDur = makeRO(byId("ro-dur"), 4, 2, "am", "Duration");
  var roTools = makeRO(byId("ro-tools"), 3, -1, "am", "Tools");
  var roHErr = makeRO(byId("ro-herr"), 3, -1, "am", "Errors");
  var roHCtx = makeRO(byId("ro-hctx"), 4, -1, "am", "Context", "k");

  var selectedId = null, cursor = null, firstLoad = true;
  var lastNowMs = 0, lastNowAt = 0;      // the API clock and when we received it
  var sessList = [], sessById = new Map(), selSummary = null;
  var rackRows = new Map();              // session id -> row record (keyed diff)
  var actRows = new Map();               // activity key -> row element
  var noKeySeq = 0;
  var presentOn = location.hash === "#present";  // a demo tab can be bookmarked
  var savedSelId = null;                 // pre-present selection, restored on exit

  function wallNow() {  // API now_ms advanced locally between polls
    return lastNowMs ? lastNowMs + (Date.now() - lastNowAt) : Date.now();
  }

  // duration_ms only counts finished turns; a running session shows elapsed time
  // since it started, measured against the API's now_ms (not the client clock).
  function durationText(s) {
    if (s.status === "running") {
      return fmtDur(Math.max(0, (lastNowMs || Date.now()) - s.created_ms));
    }
    return fmtDur(s.duration_ms);
  }

  function selDurMs(s) {
    return s.status === "running" ? Math.max(0, wallNow() - s.created_ms) : s.duration_ms;
  }

  function selectedSession() { return selSummary || sessById.get(selectedId) || null; }

  // --- instrument strip -----------------------------------------------------------

  function renderStripCounts() {
    var run = 0, fail = 0, errs = 0;
    for (var i = 0; i < sessList.length; i++) {
      var s = sessList[i];
      if (s.status === "running") { run++; }
      else if (s.status === "failed") { fail++; }
      errs += s.errors || 0;
    }
    setRO(roRun, two(Math.min(run, 99)));
    setRO(roFail, two(Math.min(fail, 99)));
    setRO(roErr, three(Math.min(errs, 999)));
    setHue(roErr, errs > 0 ? "rd" : "am");
  }

  function ctxStr(s) {
    if (s && s.last_context_tokens != null) {
      return padL(String(Math.min(Math.round(s.last_context_tokens / 1000), 9999)), 4);
    }
    return "    ";
  }

  function renderStripSel() {
    var s = selectedSession();
    setRO(roCtx, ctxStr(s));
    setRO(roElapsed, s ? fmtElapsedRO(selDurMs(s)) : "    ");
  }

  function tickClock() {
    var d = new Date(wallNow());
    setRO(roClock, two(d.getHours()) + ":" + two(d.getMinutes()));
  }

  // API unreachable: every strip readout becomes blinking dashes (unset clock).
  var stripROs = [roRun, roFail, roErr, roCtx, roElapsed, roClock];
  var stripUnsetVals = ["--", "--", "---", "----", "--:--", "--:--"];
  var stripUnsetOn = false;

  function setStripUnset(on) {
    if (on === stripUnsetOn) { return; }
    stripUnsetOn = on;
    for (var i = 0; i < stripROs.length; i++) {
      stripROs[i].host.classList.toggle("unset", on);
      if (on) { setRO(stripROs[i], stripUnsetVals[i]); }
    }
    if (!on) { tickClock(); }
  }

  // --- session rack (keyed diff: unchanged data must not touch the DOM) ------------

  function decorateRow(rec, s) {
    var pair = STATUS[s.status] || STATUS.idle;
    setText(rec.st, pair[1]);
    if (rec.st.className !== "st " + pair[0]) { rec.st.className = "st " + pair[0]; }
    if (rec.lamp.className !== "lamp " + pair[0]) { rec.lamp.className = "lamp " + pair[0]; }
    setText(rec.sid, s.id.slice(0, 13));
    var title = s.title || "(no title)";
    setText(rec.title, title);
    if (rec.title.getAttribute("title") !== title) { rec.title.setAttribute("title", title); }
    setText(rec.mS, fmtStarted(s.created_ms));
    setText(rec.mD, durationText(s));
    setText(rec.mT, s.tool_calls + (s.tool_calls === 1 ? " tool" : " tools"));
    setText(rec.mE, (s.errors || 0) + " err");
    var ecls = s.errors ? "m-e bad" : "m-e";
    if (rec.mE.className !== ecls) { rec.mE.className = ecls; }
    setText(rec.mC, s.last_context_tokens != null ? "ctx " + fmtK(s.last_context_tokens) : "");
  }

  function buildRow(s) {
    var row = el("div", "row");
    row._id = s.id;
    row.tabIndex = 0;
    row.setAttribute("role", "option");
    row.setAttribute("aria-selected", "false");
    var r1 = el("div", "r1");
    var lamp = el("i", "lamp");
    var st = el("span", "st");
    var sid = el("span", "sid");
    r1.appendChild(lamp); r1.appendChild(st); r1.appendChild(sid);
    row.appendChild(r1);
    var title = el("div", "rtitle");
    row.appendChild(title);
    var meta = el("div", "rmeta");
    var mS = el("span"), mD = el("span"), mT = el("span");
    var mE = el("span", "m-e"), mC = el("span");
    meta.appendChild(mS); meta.appendChild(mD); meta.appendChild(mT);
    meta.appendChild(mE); meta.appendChild(mC);
    row.appendChild(meta);
    var rec = { id: s.id, el: row, lamp: lamp, st: st, sid: sid, title: title,
                mS: mS, mD: mD, mT: mT, mE: mE, mC: mC };
    decorateRow(rec, s);
    row.addEventListener("click", function () { select(s.id); });
    row.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " " || ev.key === "Spacebar") {
        ev.preventDefault();
        select(s.id);
      }
    });
    rackRows.set(s.id, rec);
    return rec;
  }

  function renderRack() {
    // Update in place, insert new rows at their slot, drop vanished ones;
    // reorder only where the DOM child order actually differs from the data.
    for (var i = 0; i < sessList.length; i++) {
      var s = sessList[i];
      var rec = rackRows.get(s.id);
      if (!rec) { rec = buildRow(s); }  // buildRow decorates the fresh row
      else { decorateRow(rec, s); }     // diffed: identical values touch nothing
      var cur = rackEl.children[i];
      if (cur !== rec.el) { rackEl.insertBefore(rec.el, cur || null); }
    }
    while (rackEl.children.length > sessList.length) {
      var last = rackEl.lastChild;
      rackRows.delete(last._id);
      rackEl.removeChild(last);
    }
    rackEmptyEl.hidden = sessList.length !== 0;
  }

  // --- selection ---------------------------------------------------------------------

  function select(id) {
    if (selectedId === id) { return; }
    selectedId = id;
    cursor = null;
    selSummary = null;
    actRows.clear();
    timelineEl.textContent = "";
    setHead(null);
    rackRows.forEach(function (rec) {
      var sel = rec.id === id;
      if (rec.el.classList.contains("sel") !== sel) {
        rec.el.classList.toggle("sel", sel);
        rec.el.setAttribute("aria-selected", sel ? "true" : "false");
      }
    });
    renderStripSel();
    fetchActivity();
  }

  function setHead(s) {
    if (!s) {
      noselEl.hidden = false;
      dhEl.hidden = true;
      return;
    }
    noselEl.hidden = true;
    dhEl.hidden = false;
    var pair = STATUS[s.status] || STATUS.idle;
    setText(dhSt, pair[1]);
    if (dhSt.className !== "st " + pair[0]) { dhSt.className = "st " + pair[0]; }
    var title = s.title || "(no title)";
    setText(dhTitle, title);
    if (dhTitle.getAttribute("title") !== title) { dhTitle.setAttribute("title", title); }
    setText(dhId, s.id);
    setText(dhDir, s.directory || "");
    setRO(roDur, fmtElapsedRO(selDurMs(s)));
    setRO(roTools, three(Math.min(s.tool_calls, 999)));
    setRO(roHErr, three(Math.min(s.errors || 0, 999)));
    setHue(roHErr, s.errors > 0 ? "rd" : "am");
    setRO(roHCtx, ctxStr(s));
    renderStripSel();
  }

  // --- activity timeline ---------------------------------------------------------------

  function nearBottom() {
    return timelineEl.scrollHeight - timelineEl.scrollTop - timelineEl.clientHeight < 48;
  }

  function decorateAct(row, a) {
    setText(row._t, a.time);
    setText(row._kind, a.label);
    setText(row._summary, a.summary);
    setText(row._detail, (a.detail && a.summary.indexOf(a.detail) === -1)
      ? "-> " + a.detail : "");
    var live = a.status === "running" || a.status === "pending";
    var err = a.status === "error" || a.status === "failed";
    row.classList.toggle("live", live);
    row.classList.toggle("err", err);
  }

  function buildAct(a) {
    var row = el("div", "act");
    row.appendChild(el("i", "lamp"));
    row._t = el("span", "t");
    row._kind = el("span", "kind");
    row._summary = el("span", "summary");
    row._detail = el("span", "detail");
    row.appendChild(row._t);
    row.appendChild(row._kind);
    row.appendChild(row._summary);
    row.appendChild(row._detail);
    decorateAct(row, a);
    return row;
  }

  function appendActivity(items) {
    if (!items.length) { return; }
    var stick = presentOn || nearBottom();  // present mode always pins the newest row
    for (var i = 0; i < items.length; i++) {
      var a = items[i];
      var key = a.key || ("_nokey_" + noKeySeq++);
      var row = actRows.get(key);
      if (row) {
        decorateAct(row, a);  // same key re-emitted (running -> completed): replace in place
      } else {
        row = buildAct(a);
        actRows.set(key, row);
        timelineEl.appendChild(row);
      }
    }
    if (stick) { timelineEl.scrollTop = timelineEl.scrollHeight; }
  }

  // --- polling ----------------------------------------------------------------------------

  function fetchJson(url) {
    return fetch(url).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          var err = new Error(data.error || ("HTTP " + res.status));
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  function showError(err) {
    setText(errorEl, "API error: " + (err && err.message ? err.message : String(err)));
    errorEl.hidden = false;
  }

  function fetchActivity() {
    if (!selectedId) { return Promise.resolve(); }
    var url = "/api/sessions/" + encodeURIComponent(selectedId) + "/activity";
    if (cursor) { url += "?after=" + encodeURIComponent(cursor); }
    return fetchJson(url).then(function (data) {
      errorEl.hidden = true;
      selSummary = data.summary || null;
      setHead(selSummary);
      appendActivity(data.activity || []);
      if (presentOn) { timelineEl.scrollTop = timelineEl.scrollHeight; }  // head reflow can unpin it
      cursor = data.cursor || null;
    }, function (err) {
      showError(err);
      if (String(err && err.message).indexOf("cursor") !== -1) { cursor = null; }
    });
  }

  function autoSelect() {
    if (!firstLoad) { return; }
    firstLoad = false;
    if (!sessList.length) { return; }
    var newestRunning = null;  // list is newest first
    for (var i = 0; i < sessList.length; i++) {
      if (sessList[i].status === "running") { newestRunning = sessList[i]; break; }
    }
    select((newestRunning || sessList[0]).id);
  }

  // --- present mode ---------------------------------------------------------------------

  // The demo view shows the newest running worker (the list is newest first) and
  // switches when a newer one starts; with nothing running it keeps the selection.
  function presentFollow() {
    if (!presentOn) { return; }
    for (var i = 0; i < sessList.length; i++) {
      if (sessList[i].status === "running") {
        if (sessList[i].id !== selectedId) { select(sessList[i].id); }
        return;
      }
    }
  }

  function setPresent(on) {
    if (on === presentOn) { return; }
    presentOn = on;
    document.body.classList.toggle("present", on);
    presentBtn.setAttribute("aria-pressed", on ? "true" : "false");
    history.replaceState(null, "", on ? "#present" : location.pathname + location.search);
    if (on) {
      savedSelId = selectedId;  // the user's own selection comes back on exit
      presentFollow();
    } else if (savedSelId && savedSelId !== selectedId && sessById.has(savedSelId)) {
      select(savedSelId);
    }
    timelineEl.scrollTop = timelineEl.scrollHeight;
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      if (presentOn) { setPresent(false); }
      return;
    }
    if (ev.key !== "p" && ev.key !== "P") { return; }
    if (ev.ctrlKey || ev.metaKey || ev.altKey) { return; }
    var t = ev.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) { return; }
    setPresent(!presentOn);
  });
  presentBtn.addEventListener("click", function () { setPresent(!presentOn); });

  function pollSessions() {
    fetchJson("/api/sessions?limit=" + SESSIONS_LIMIT).then(function (data) {
      errorEl.hidden = true;
      if (data.now_ms) { lastNowMs = data.now_ms; lastNowAt = Date.now(); }
      setText(scopePathEl, data.scope || "");
      degradedEl.hidden = !data.layoutDegraded;
      sessList = data.sessions || [];
      sessById = new Map();
      for (var i = 0; i < sessList.length; i++) { sessById.set(sessList[i].id, sessList[i]); }
      setStripUnset(false);
      renderStripCounts();
      renderRack();
      renderStripSel();
      tickClock();
      autoSelect();
      presentFollow();
    }, function (err) {
      showError(err);
      setStripUnset(true);
    }).then(function () {
      setTimeout(pollSessions, SESSIONS_MS);
    });
  }

  function pollActivity() {
    fetchActivity().then(function () {
      setTimeout(pollActivity, ACTIVITY_MS);
    });
  }

  // The only local timer: advances the wall clock and running elapsed readouts.
  setInterval(function () {
    if (stripUnsetOn) { return; }
    tickClock();
    var s = selectedSession();
    if (s && s.status === "running") {
      setRO(roElapsed, fmtElapsedRO(selDurMs(s)));
      if (!dhEl.hidden) { setRO(roDur, fmtElapsedRO(selDurMs(s))); }
    }
  }, 1000);

  if (presentOn) {  // #present bookmark: enter the mode before first paint
    document.body.classList.add("present");
    presentBtn.setAttribute("aria-pressed", "true");
  }
  setHead(null);
  tickClock();
  pollSessions();
  pollActivity();
})();
</script>
</body>
</html>
